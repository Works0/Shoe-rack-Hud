<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        :root { --glass: rgba(0, 0, 0, 0.7); --glow: 0 0 15px rgba(255, 255, 255, 0.6); }
        body { margin: 0; padding: 40px; font-family: 'Segoe UI', sans-serif; color: #fff; 
               background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://i.imgur.com/eBw0k7t.jpeg'); 
               background-size: cover; background-position: center; background-attachment: fixed; min-height: 100vh; }
        .container { position: relative; z-index: 1; max-width: 600px; margin: 2% auto; background: rgba(0, 0, 0, 0.5); padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); }
        
        h1 { font-size: 24px; text-align: center; color: #fff; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 35px; font-family: 'Courier New', Courier, monospace; font-weight: 300; }
        
        .menu-btn, .remove-hud-btn { 
            display: block; width: 70%; margin: 0 auto 10px auto; 
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); 
            color: #fff; padding: 20px 10px; text-transform: uppercase; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px; font-weight: 500; letter-spacing: 2px; cursor: pointer; border-radius: 6px; 
            opacity: 0.7; transition: 0.3s; 
        }
        .menu-btn:hover, .remove-hud-btn:hover { opacity: 1; }
        .active-glow { border-color: #fff !important; box-shadow: var(--glow) !important; opacity: 1 !important; }
        
        .slot-container { display: none; padding: 15px; text-align: center; }
        .slot-btn { width: 45px; height: 35px; font-size: 14px; font-family: 'Courier New', Courier, monospace; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #777; cursor: pointer; margin: 3px; }
        
    </style>
</head>
<body>
    <div class="container">
        <h1>𝘊 𝘖 𝘙 𝘌 𝘟 // 𝘚 𝘠 𝘕 𝘊</h1>
        
        <div id="main-menu">
            <!-- Buttons are generated by script -->
        </div>

        <button class="remove-hud-btn" onclick="send('HUD','remove')">Remove HUD</button>
    </div>

    <script>
        window.onload = function() {
            var categories = [
                ["Athletic", "Athletic"],
                ["Boots", "Boots"],
                ["Casual", "Casual"],
                ["Heels", "Heels"],
                ["Sandals", "Sandals"],
                ["Formal", "Formal"]
            ];

            var menu = document.getElementById('main-menu');
            
            categories.forEach(function(cat) {
                // Create Button
                var btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = cat[0];
                btn.onclick = function() { toggleSlots(this); };
                menu.appendChild(btn);

                // Create Slot Container (10 slots)
                var div = document.createElement('div');
                div.className = 'slot-container';
                for(var i=1; i<=10; i++) {
                    div.innerHTML += `<button class="slot-btn" onclick="send('${cat[1]}','style${i}')">${i}</button>`;
                }
                menu.appendChild(div);
            });
        };

        function toggleSlots(btn) {
            var slots = btn.nextElementSibling;
            // Close other open slots
            document.querySelectorAll('.slot-container').forEach(s => { if(s !== slots) s.style.display = 'none'; });
            document.querySelectorAll('.menu-btn').forEach(b => { if(b !== btn) b.classList.remove('active-glow'); });
            
            // Toggle current
            slots.style.display = (slots.style.display === 'block') ? 'none' : 'block';
            btn.classList.toggle('active-glow');
        }

        function send(part, style) { 
            var f = document.getElementById('sl_form'); 
            f.action = window.location.hash.substring(1); 
            document.getElementById('p_data').value = part + "," + style; 
            f.submit(); 
        }
    </script>
    <iframe name="secret_frame" style="display:none;"></iframe>
    <form id="sl_form" method="POST" target="secret_frame" style="display:none;"><input type="hidden" id="p_data" name="cmd"></form>
</body>
</html>
